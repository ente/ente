name: Restore Rust target
description: Restore Rust artifacts and source timestamps

inputs:
    shared-key:
        description: Cache group
        required: true
    lookup-only:
        description: Check without restoring
        default: false

outputs:
    cache-key:
        description: Cache key
        value: ${{ steps.cache.outputs.cache-primary-key }}
    cache-hit:
        description: Exact cache hit
        value: ${{ steps.cache.outputs.cache-hit }}

runs:
    using: composite
    steps:
        # Runner image changes can break cached binaries.
        - id: image
          shell: bash
          run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

        - id: cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              key: target-${{ inputs.shared-key }}-${{ steps.image.outputs.version }}-${{ github.sha }}
              restore-keys: target-${{ inputs.shared-key }}-${{ steps.image.outputs.version }}-
              path: rust/target
              lookup-only: ${{ inputs.lookup-only }}

        - if: inputs.lookup-only != 'true' && steps.cache.outputs.cache-matched-key != ''
          shell: bash
          working-directory: ${{ github.workspace }}
          run: node .github/actions/restore-rust-target/mtimes.mjs restore
