name: "Lint (Android)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: photos-desktop-ensu-android
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: photos-desktop-ensu-android

            - name: Install Vulkan build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvulkan-dev glslc

            - name: Restore Gradle cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: gradle-${{ github.sha }}
                  restore-keys: gradle-
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper

            - run: ./android/scripts/lint.sh

            - name: Build Ensu
              working-directory: android
              run: ./gradlew --build-cache :ensu:app:assembleDebug
