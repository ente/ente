name: CI

on:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    select:
        name: Select CI
        runs-on: ubuntu-latest
        outputs:
            jobs: ${{ steps.select.outputs.jobs }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - id: select
              run: node .github/scripts/ci/check.mjs select HEAD^1 HEAD

    dependency-review:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'dependency-review') }}
        uses: ./.github/workflows/dependency-review.yml

    desktop-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'desktop-lint') }}
        uses: ./.github/workflows/desktop-lint.yml

    docs-verify-build:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'docs-verify-build') }}
        uses: ./.github/workflows/docs-verify-build.yml

    ensu-android-build:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'ensu-android-build') }}
        uses: ./.github/workflows/ensu-android-build.yml

    ensu-ios-build:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'ensu-ios-build') }}
        uses: ./.github/workflows/ensu-ios-build.yml

    infra-lint-staff:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'infra-lint-staff') }}
        uses: ./.github/workflows/infra-lint-staff.yml

    mobile-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'mobile-lint') }}
        uses: ./.github/workflows/mobile-lint.yml

    mobile-podfile-lock:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'mobile-podfile-lock') }}
        uses: ./.github/workflows/mobile-podfile-lock.yml

    repo-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'repo-lint') }}
        uses: ./.github/workflows/repo-lint.yml

    rust-cli-test:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'rust-cli-test') }}
        uses: ./.github/workflows/rust-cli-test.yml

    rust-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'rust-lint') }}
        uses: ./.github/workflows/rust-lint.yml

    rust-test:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'rust-test') }}
        uses: ./.github/workflows/rust-test.yml

    server-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'server-lint') }}
        uses: ./.github/workflows/server-lint.yml

    web-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'web-lint') }}
        uses: ./.github/workflows/web-lint.yml

    required:
        name: CI required
        if: ${{ always() }}
        needs:
            - select
            - dependency-review
            - desktop-lint
            - docs-verify-build
            - ensu-android-build
            - ensu-ios-build
            - infra-lint-staff
            - mobile-lint
            - mobile-podfile-lock
            - repo-lint
            - rust-cli-test
            - rust-lint
            - rust-test
            - server-lint
            - web-lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - run: node .github/scripts/ci/check.mjs result
              env:
                  NEEDS: ${{ toJSON(needs) }}
