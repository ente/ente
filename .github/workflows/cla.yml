name: CLA

on:
    pull_request_target:
        branches: [main]
        types: [opened, synchronize, reopened, edited]
    status:
    workflow_dispatch:
        inputs:
            pull_request:
                description: PR number
                type: number
                required: true

permissions:
    contents: read
    pull-requests: read
    statuses: write

jobs:
    cla:
        name: Evaluate CLA
        if: >-
            github.repository == 'ente/ente' &&
            (github.event_name != 'status' || github.event.context == 'license/cla')
        runs-on: ubuntu-latest
        concurrency:
            group: cla
            queue: max
        steps:
            - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const coveredUsers = new Map([
                          [254676, "ua741"],
                          [1161789, "vishnukvmd"],
                          [2698932, "anandbaburajan"],
                          [24503581, "mnvr"],
                          [41898282, "github-actions[bot]"],
                          [58779643, "crowdin-bot"],
                          [64626875, "AswinAsok"],
                          [77285023, "ashilkn"],
                          [81471280, "laurenspriem"],
                          [113718372, "setalp"],
                          [118678415, "r4khul"],
                          [118880285, "Jishnuraj9"],
                          [146618155, "AmanRajSinghMourya"],
                          [157287863, "vijayadithyanpj"],
                          [231175576, "neeraj-pilot"],
                          [236760864, "Shanthy17"],
                          [239996999, "laurens-pilot"],
                          [281837475, "aman-pilot"],
                          [290690209, "ente-ci[bot]"],
                          [293300083, "ashil-pilot"],
                          [327484853, "ente-approver[bot]"],
                          [341794418, "ente-agent[bot]"],
                      ]);
                      const repo = context.repo;
                      const pr = context.eventName === "status" ? null : (await github.rest.pulls.get({
                          ...repo,
                          pull_number: context.payload.pull_request?.number ?? Number(context.payload.inputs.pull_request),
                      })).data;
                      if (pr && (pr.state !== "open" || pr.base.ref !== "main")) return;
                      const sha = pr?.head.sha ?? context.payload.sha;
                      const readCLA = async () => (await github.paginate(
                          github.rest.repos.getCombinedStatusForRef,
                          { ...repo, ref: sha, per_page: 100 },
                          ({ data }) => data.statuses,
                      )).find(({ context }) => context === "license/cla");
                      let cla = await readCLA();
                      let covered = false;
                      if (!cla && pr && coveredUsers.has(pr.user.id)) {
                          const { data } = await github.rest.repos.compareCommitsWithBasehead({
                              ...repo,
                              basehead: `${pr.base.sha}...${sha}`,
                          });
                          const peers = (await github.paginate(github.rest.pulls.list, {
                              ...repo, state: "open", base: "main", per_page: 100,
                          })).filter(pull => pull.head.sha === sha);
                          covered = peers.length === 1 && peers[0].number === pr.number &&
                              data.commits.length > 0 && data.commits.length === data.total_commits &&
                              data.commits.every(({ author, commit }) =>
                                  coveredUsers.has(author?.id) &&
                                  !/co-authored-by/i.test(commit.message));
                          cla = await readCLA();
                      }
                      await github.rest.repos.createCommitStatus({
                          ...repo, sha, context: "CLA",
                          state: cla?.state ?? (covered ? "success" : "pending"),
                          description: cla ? cla.description : covered
                              ? "Verified CLA coverage is cached."
                              : "Waiting for CLA Assistant to report a result.",
                          target_url: cla ? cla.target_url : `https://cla-assistant.io/${repo.owner}/${repo.repo}`,
                      });
