name: "Release (CLI)"

on:
    push:
        tags:
            - "cli-v*"

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                goos: [linux, windows, darwin]
                goarch: ["386", amd64, arm64]
                exclude:
                    - goarch: "386"
                      goos: darwin

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: cli/go.mod
                  cache: false

            - name: Build release asset
              id: build
              env:
                  CGO_ENABLED: 0
                  GOARCH: ${{ matrix.goarch }}
                  GOOS: ${{ matrix.goos }}
              run: |
                  set -euo pipefail

                  asset="ente-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
                  binary="ente"
                  dist="$RUNNER_TEMP/cli-release"
                  version="${GITHUB_REF_NAME#cli-}"

                  if [ "$GOOS" = windows ]; then
                      binary="ente.exe"
                  fi

                  mkdir -p "$dist"
                  go build -C cli -trimpath -ldflags "-X main.AppVersion=$version -s -w" -o "$dist/$binary"

                  cd "$dist"
                  if [ "$GOOS" = windows ]; then
                      asset="$asset.zip"
                      zip -vr "$asset" "$binary"
                  else
                      asset="$asset.tar.gz"
                      tar cvfz "$asset" "$binary"
                  fi

                  echo "asset=$asset" >> "$GITHUB_OUTPUT"
                  echo "asset_path=$dist/$asset" >> "$GITHUB_OUTPUT"

            - name: Upload release asset
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.build.outputs.asset }}
                  path: ${{ steps.build.outputs.asset_path }}
                  if-no-files-found: error
                  compression-level: 0

    release:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: write
        steps:
            - name: Download release assets
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: ${{ runner.temp }}/cli-release-assets
                  pattern: ente-${{ github.ref_name }}-*
                  merge-multiple: true

            - name: Create draft release
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  cd "$RUNNER_TEMP/cli-release-assets"
                  sha256sum * | sort -k2 > SHA256SUMS
                  gh release create "$GITHUB_REF_NAME" \
                      --draft \
                      --notes "" \
                      --title "$GITHUB_REF_NAME" \
                      --verify-tag \
                      *
