# This custom workflow runs nightly because per-push CodeQL is too slow.

name: "CodeQL"

on:
    workflow_dispatch:
    schedule:
        - cron: "22 17 * * *"

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: 'ubuntu-latest'
        env:
            CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
        permissions:
            contents: read
            security-events: write
            # Fetch private CodeQL packs.
            packages: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: actions
                      build-mode: none
                    - language: go
                      build-mode: autobuild
                    - language: javascript-typescript
                      build-mode: none
                    - language: rust
                      build-mode: none

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  config: |
                      paths-ignore:
                          - rust/**/tests/**

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  category: "/language:${{matrix.language}}"
