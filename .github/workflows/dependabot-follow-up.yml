name: Dependabot follow-up

on:
    schedule:
        - cron: "30 2-14 * * 1-5"
    workflow_dispatch:

permissions:
    contents: read
    actions: read
    checks: read
    pull-requests: read

concurrency:
    group: dependabot-follow-up
    cancel-in-progress: false

jobs:
    find:
        if: github.repository == 'ente/ente' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            prs: ${{ steps.find.outputs.result }}
        steps:
            - id: find
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const repo = context.repo;
                      const { data: { workflow_runs: previous } } = await github.rest.actions.listWorkflowRuns({
                          ...repo, workflow_id: "dependabot-follow-up.yml", branch: "main", status: "success", per_page: 1,
                      });
                      const since = previous[0]?.created_at || "";
                      const selected = [];
                      for (const pr of await github.paginate(github.rest.pulls.list, { ...repo, state: "open", base: "main", per_page: 100 })) {
                          if (pr.draft || pr.user.login !== "dependabot[bot]" ||
                              pr.head.repo?.full_name !== `${repo.owner}/${repo.repo}` || !/^dependabot\/(cargo|github_actions)\//.test(pr.head.ref)) continue;
                          const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                              ...repo, workflow_id: "ci.yml", event: "pull_request", head_sha: pr.head.sha, per_page: 100,
                          });
                          if (!runs.length || runs.some(run => run.status !== "completed")) continue;
                          const comments = await github.paginate(github.rest.issues.listComments, {
                              ...repo, issue_number: pr.number, since: since || undefined, per_page: 100,
                          });
                          if (pr.created_at > since || runs.some(run => run.updated_at > since) ||
                              comments.some(comment => comment.user.login !== "ente-agent[bot]" && comment.created_at > since &&
                                  (["OWNER", "MEMBER", "COLLABORATOR"].includes(comment.author_association) ||
                                      comment.user.login === "github-actions[bot]"))) {
                              const commits = await github.paginate(github.rest.pulls.listCommits, {
                                  ...repo, pull_number: pr.number, per_page: 100,
                              });
                              const reviewOnly = pr.head.ref.startsWith("dependabot/github_actions/") ||
                                  commits.filter(commit => commit.author?.login === "ente-agent[bot]").length >= 3;
                              selected.push({ number: pr.number, head: pr.head.sha, reviewOnly });
                          }
                      }
                      return selected;

    work:
        needs: find
        if: needs.find.outputs.prs != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment:
            name: pr-review
            deployment: false
        strategy:
            fail-fast: false
            matrix:
                pr: ${{ fromJSON(needs.find.outputs.prs) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Prepare agent
              env:
                  PR_URL: https://github.com/${{ github.repository }}/pull/${{ matrix.pr.number }}
              run: |
                  mkdir -p "$RUNNER_TEMP/codex" "$RUNNER_TEMP/result"
                  touch "$RUNNER_TEMP/result/report.md"
                  { printf '%s\n\n' "$PR_URL"; cat .github/scripts/dependencies.md; } > "$RUNNER_TEMP/prompt.md"
                  if [[ "${{ matrix.pr.reviewOnly }}" == true ]]; then
                      printf '\n%s\n' "Review only. Do not edit files; recommend any required fixes in your final report." >> "$RUNNER_TEMP/prompt.md"
                  fi
                  cat > "$RUNNER_TEMP/codex/config.toml" <<EOF
                  project_doc_max_bytes = 0
                  [skills]
                  include_instructions = false
                  [projects."$GITHUB_WORKSPACE"]
                  trust_level = "untrusted"
                  [permissions.update]
                  extends = ":workspace"
                  [permissions.update.filesystem.":workspace_roots"]
                  ".git" = "write"
                  [permissions.update.network]
                  enabled = true
                  EOF

            - name: Setup Linux for Rust
              if: ${{ !matrix.pr.reviewOnly }}
              uses: ./.github/actions/setup-rust-linux

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ matrix.pr.head }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Prepare dependency update
              uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
              env:
                  GH_TOKEN: ${{ github.token }}
                  CARGO_HOME: /tmp/cargo
                  XDG_CACHE_HOME: /tmp/cache
              with:
                  codex-home: ${{ runner.temp }}/codex
                  prompt-file: ${{ runner.temp }}/prompt.md
                  output-file: ${{ runner.temp }}/result/report.md
                  openai-api-key: ${{ secrets.OPENAI_API_KEY }}
                  responses-api-endpoint: ${{ format('{0}/responses', vars.OPENAI_BASE_URL) }}
                  model: ${{ vars.CODEX_MODEL }}
                  effort: high
                  permission-profile: update
                  safety-strategy: drop-sudo
                  allow-users: "*"

            - name: Collect changes
              env:
                  PR_HEAD: ${{ matrix.pr.head }}
              run: |
                  git add -A
                  git diff --binary --no-ext-diff --no-textconv "$PR_HEAD" > "$RUNNER_TEMP/result/changes.patch"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dependency-${{ matrix.pr.number }}
                  path: ${{ runner.temp }}/result
                  overwrite: true

    publish:
        needs: [find, work]
        if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.prs != '[]' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        environment:
            name: pr-review
            deployment: false
        strategy:
            fail-fast: false
            matrix:
                pr: ${{ fromJSON(needs.find.outputs.prs) }}
        steps:
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app
              with:
                  client-id: ${{ secrets.ENTE_AGENT_GH_CLIENT_ID }}
                  private-key: ${{ secrets.ENTE_AGENT_GH_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ matrix.pr.head }}
                  token: ${{ steps.app.outputs.token }}

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dependency-${{ matrix.pr.number }}
                  path: ${{ runner.temp }}/result

            - name: Publish changes and report
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PR_NUMBER: ${{ matrix.pr.number }}
                  PR_HEAD: ${{ matrix.pr.head }}
                  REVIEW_ONLY: ${{ matrix.pr.reviewOnly }}
              with:
                  github-token: ${{ steps.app.outputs.token }}
                  script: |
                      const { readFileSync } = require("node:fs");
                      const { execFileSync } = require("node:child_process");
                      const git = (...args) => execFileSync("git", args, { stdio: "inherit" });
                      const repo = context.repo;
                      const head = process.env.PR_HEAD;
                      const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: Number(process.env.PR_NUMBER) });
                      if (pr.state !== "open" || pr.draft || pr.head.sha !== head || pr.base.ref !== "main" ||
                          pr.user.login !== "dependabot[bot]" || pr.head.repo?.full_name !== `${repo.owner}/${repo.repo}` ||
                          !/^dependabot\/(cargo|github_actions)\//.test(pr.head.ref)) return;
                      const result = `${process.env.RUNNER_TEMP}/result`;
                      const report = readFileSync(`${result}/report.md`, "utf8").trim();
                      if (process.env.REVIEW_ONLY === "false" && readFileSync(`${result}/changes.patch`).length) {
                          git("apply", "--index", `${result}/changes.patch`);
                          const { data: bot } = await github.rest.users.getByUsername({ username: "ente-agent[bot]" });
                          git("config", "user.name", bot.login);
                          git("config", "user.email", `${bot.id}+${bot.login}@users.noreply.github.com`);
                          git("commit", "-m", "Prepare dependency updates");
                          git("push", `--force-with-lease=refs/heads/${pr.head.ref}:${head}`, "origin", `HEAD:refs/heads/${pr.head.ref}`);
                      }
                      if (report) await github.rest.issues.createComment({
                          ...repo, issue_number: pr.number,
                          body: `## Dependency update\n\n[Agent run](${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}) · Commit ${head.slice(0, 7)}\n\n${report}`,
                      });
