name: "Lint (Photos desktop)"

on:
    pull_request:
        paths:
            - ".github/workflows/desktop-lint.yml"
            - "desktop/**"
            - "rust/bindings/napi/**"
            - "rust/crates/photos/**"
            - "rust/crates/image/**"
            - "rust/apps/codegen/**"
            - "rust/Cargo.toml"
            - "rust/Cargo.lock"

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: desktop
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup node and enable npm caching
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "desktop/package-lock.json"

            - run: npm ci

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: photos-desktop-ensu-android
                  save-if: false

            # tsc typechecks against the generated rust-bindings/index.d.ts.
            # This generates only the declarations (via cargo check); it does
            # not build the addon.
            - name: Generate N-API rust bindings
              working-directory: rust
              run: cargo codegen napi

            - run: npm run lint
