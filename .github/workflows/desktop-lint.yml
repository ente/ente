name: "Lint (Photos desktop)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: desktop
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node and enable npm caching
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "desktop/package-lock.json"

            - run: npm ci

            - run: npm run postinstall

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: photos-desktop-ensu-android
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: photos-desktop-ensu-android

            - run: npm run codegen:napi

            - run: npm run lint
