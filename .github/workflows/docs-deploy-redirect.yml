name: "Deploy (help.ente.io redirect)"

on:
    push:
        branches: [main]
        paths:
            - "infra/services/help-redir/**"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Deploy redirect to help.ente.io
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  # This replaces help.ente.io with only the redirect files.
                  command: pages deploy --project-name=ente --commit-dirty=true --branch=help infra/services/help-redir
