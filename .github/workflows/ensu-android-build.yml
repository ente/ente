name: "Build (Ensu Android)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Check Android fonts
              working-directory: android
              run: |
                  ./gradlew \
                    :packages:fonts:ktfmtCheck \
                    :packages:fonts:lintDebug \
                    :packages:fonts:assembleDebug

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: photos-desktop-ensu-android
                  save-if: false

            # cargo codegen native enables llama.cpp's Vulkan backend on Linux.
            - name: Install Vulkan build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvulkan-dev glslc

            - run: cargo codegen native
              working-directory: rust

            - name: Build Ensu
              working-directory: android
              run: ./gradlew :apps:ensu:app:assembleDebug
