name: "Build (Ensu iOS)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: macos-26

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: ensu-ios
                  save-if: false

            - run: cargo codegen native
              working-directory: rust

            # PRs lack inference fixtures, so this only tests build and startup.
            - name: Build and test Ensu
              working-directory: apple/apps/ensu
              run: xcodebuild test -scheme Ensu -destination 'platform=iOS Simulator,name=iPhone 17'
