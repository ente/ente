name: "Sync Crowdin (Mobile)"

on:
    schedule:
        # Mondays at ~6:20 AM IST
        - cron: "50 0 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    synchronize-with-crowdin:
        name: "Sync mobile strings with Crowdin"
        runs-on: ubuntu-latest
        environment:
            name: crowdin-sync
            deployment: false

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Mint App token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.ENTE_CI_GH_CLIENT_ID }}
                  private-key: ${{ secrets.ENTE_CI_GH_APP_PRIVATE_KEY }}
                  repositories: ente
                  permission-contents: write
                  permission-pull-requests: write

            - name: Crowdin's action
              uses: crowdin/github-action@9af557de76d70c480f88065d336f445a362f402b # v3.1.0
              with:
                  config: mobile/packages/strings/crowdin.yml
                  upload_sources: true
                  upload_translations: false
                  download_translations: true
                  localization_branch_name: translations/mobile
                  create_pull_request: true
                  skip_untranslated_strings: true
                  pull_request_title: "[mobile] New translations"
                  pull_request_body: "New translations from [Crowdin](https://crowdin.com/project/ente-photos-app)"
                  pull_request_base_branch_name: "main"
                  project_id: 574741
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
