name: "Verify Podfile.lock (Mobile)"

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pod-check:
        runs-on: macos-26
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            - run: flutter pub get --enforce-lockfile
              working-directory: mobile

            - name: Verify Podfile.lock is current
              run: |
                  for app in photos auth locker; do
                      echo "Checking $app"
                      ( cd "mobile/apps/$app/ios" && pod install --deployment )
                  done
