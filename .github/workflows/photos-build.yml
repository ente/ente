name: Photos archive packaging experiment

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-ios:
        if: github.repository == 'ente/ente' && github.ref == 'refs/heads/ci/photos-app-store-export-test'
        runs-on: macos-latest
        environment:
            name: production

        defaults:
            run:
                working-directory: mobile/apps/photos

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            - name: Set build version
              run: |
                  release_version="$(node ../../../.github/scripts/flutter-version.mjs photos get)"
                  build_number_base="$(node ../../../.github/scripts/flutter-version.mjs photos get-build-base)"
                  build_number=$((build_number_base + GITHUB_RUN_NUMBER))
                  node ../../../.github/scripts/flutter-version.mjs photos set-build "${release_version}" "${build_number}"
                  echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
                  echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"

            - run: flutter pub get --enforce-lockfile

            - name: Set up Rive iOS binaries
              run: dart run rive_native:setup --clean --platform ios

            - run: cargo codegen frb photos
              working-directory: rust

            - name: Install iOS pods
              run: pod install --deployment
              working-directory: mobile/apps/photos/ios

            - name: Import Apple Distribution certificate
              uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
              with:
                  p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
                  p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

            - name: Archive Photos with release signing
              env:
                  ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
                  ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  umask 077
                  key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
                  trap 'rm -f "${key_path}"' EXIT
                  printf '%s' "${ASC_API_KEY_BASE64}" | base64 --decode > "${key_path}"

                  xcodebuild archive \
                      -workspace ios/Runner.xcworkspace \
                      -scheme Runner \
                      -configuration Release \
                      -destination 'generic/platform=iOS' \
                      -archivePath build/ios/archive/Runner.xcarchive \
                      -allowProvisioningUpdates \
                      -authenticationKeyPath "${key_path}" \
                      -authenticationKeyID "${ASC_KEY_ID}" \
                      -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
                      CODE_SIGN_STYLE=Manual \
                      CODE_SIGN_IDENTITY="Apple Distribution" \
                      DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
                      APP_STORE_PROFILE_SPECIFIER="Photos App Store" \
                      SHARE_EXTENSION_APP_STORE_PROFILE_SPECIFIER="Photos Share Extension App Store" \
                      NOTIFICATION_SERVICE_EXTENSION_APP_STORE_PROFILE_SPECIFIER="Photos Notification Service Extension App Store" \
                      ALBUM_WIDGET_APP_STORE_PROFILE_SPECIFIER="Photos Album Widget App Store" \
                      MEMORY_WIDGET_APP_STORE_PROFILE_SPECIFIER="Photos Memory Widget App Store" \
                      PEOPLE_WIDGET_APP_STORE_PROFILE_SPECIFIER="Photos People Widget App Store" \
                      MARKETING_VERSION="${RELEASE_VERSION}" \
                      CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

            - name: Lock the temporary signing keychain
              run: security lock-keychain signing_temp.keychain

            - name: Package the archived app unchanged
              run: |
                  payload="${RUNNER_TEMP}/archive-bundle/Payload"
                  mkdir -p "${payload}"
                  ditto build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app "${payload}/Runner.app"
                  ditto -c -k --norsrc --keepParent "${payload}" "${RUNNER_TEMP}/Photos-Archive-Bundle.ipa"
                  shasum -a 256 "${RUNNER_TEMP}/Photos-Archive-Bundle.ipa"

            - name: Save the IPA for the BrowserStack experiment
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: photos-archive-bundle
                  path: ${{ runner.temp }}/Photos-Archive-Bundle.ipa
                  retention-days: 1
                  compression-level: 0
                  if-no-files-found: error
