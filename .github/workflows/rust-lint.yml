name: "Lint (Rust)"

on:
    workflow_call:

permissions:
    contents: read

env:
    RUSTFLAGS: -D warnings

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: rust
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Free runner disk space
              run: sudo rm -rf /usr/share/dotnet

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libvulkan-dev glslc libdbus-1-dev

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: rust-workspace
                  save-if: false
                  cache-directories: rust/.cache

            - run: cargo install cargo-audit --version 0.22.2 --locked

            - run: ./scripts/lint.sh
