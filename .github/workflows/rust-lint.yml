name: "Lint (Rust)"

on:
    workflow_call:

permissions:
    contents: read

env:
    RUSTFLAGS: -D warnings

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: rust
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Linux for Rust
              uses: ./.github/actions/setup-rust-linux

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: rust-workspace
                  cache-targets: false
                  save-if: false
                  cache-directories: rust/.cache

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: rust-workspace

            - run: cargo install cargo-audit --version 0.22.2 --locked

            - run: ./scripts/lint.sh
