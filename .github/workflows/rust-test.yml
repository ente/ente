name: "Test (Rust)"

on:
    workflow_call:

permissions:
    contents: read

env:
    RUSTFLAGS: -D warnings

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: rust

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Free runner disk space
              run: sudo rm -rf /usr/share/dotnet

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libvulkan-dev glslc libdbus-1-dev dbus gnome-keyring libglib2.0-bin

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: server/go.mod
                  cache: false

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: rust-workspace
                  cache-targets: false
                  save-if: false
                  cache-directories: rust/.cache

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: rust-workspace

            - name: Restore Museum cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: museum-${{ github.sha }}
                  restore-keys: museum-
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                      ~/.cache/.theseus/postgresql

            - run: cargo test --locked --workspace --exclude ente-cli-next --features museum,ente-ml/ml-assets
              # postgresql_embedded downloads its binaries from GitHub.
              # GITHUB_TOKEN raises the API rate limit for those downloads.
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Avoid unifying SQLCipher into other packages' SQLite tests.
            - run: cargo test --locked -p ente-cli-next --features museum
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - run: apps/cli-next/scripts/test-with-keyring-linux.sh --features museum
