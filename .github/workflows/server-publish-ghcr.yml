name: "Publish GHCR (Server)"

on:
    schedule:
        # Monthly on the 15th at ~10:30 AM IST
        - cron: '0 5 15 * *'
    workflow_dispatch:

permissions:
    actions: read
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Determine commit from prod museum
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  museum_commit="$(curl -s https://api.ente.com/ping | jq -r .id)"
                  [[ "${museum_commit}" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$(gh run list \
                      --repo "${GITHUB_REPOSITORY}" \
                      --workflow server-release.yml \
                      --commit "${museum_commit}" \
                      --status success \
                      --limit 1 \
                      --json databaseId \
                      --jq length)" -gt 0 ]]
                  echo "museum_commit=${museum_commit}" >> $GITHUB_ENV

            - name: Checkout prod museum commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.museum_commit }}

            - name: Log in to GHCR
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

            - name: Build and push
              run: |
                  docker buildx create --use
                  docker buildx build --push \
                      --file server/Dockerfile \
                      --platform linux/amd64,linux/arm64 \
                      --build-arg GIT_COMMIT="${museum_commit}" \
                      --tag ghcr.io/ente/server:${museum_commit} \
                      --tag ghcr.io/ente/server:latest \
                      server
