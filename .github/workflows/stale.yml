name: Stale PRs

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    issues: write
    pull-requests: write
    statuses: read

jobs:
    stale:
        runs-on: ubuntu-latest
        steps:
            - name: Manage pull requests missing CLA
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const repo = context.repo;
                      const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000;

                      for (const pr of await github.paginate(github.rest.pulls.list, {
                          ...repo,
                          state: "open",
                          per_page: 100,
                      })) {
                          const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({
                              ...repo,
                              ref: pr.head.sha,
                          });
                          const cla = statuses.find((status) => status.context === "license/cla");
                          const pending = pr.labels.some((label) => label.name === "pending-cla");

                          if (cla?.state === "success") {
                              if (pending) {
                                  await github.rest.issues.removeLabel({
                                      ...repo,
                                      issue_number: pr.number,
                                      name: "pending-cla",
                                  });
                              }
                              continue;
                          }
                          if (cla?.state !== "pending") continue;

                          if (!pending) {
                              await github.rest.issues.addLabels({
                                  ...repo,
                                  issue_number: pr.number,
                                  labels: ["pending-cla"],
                              });
                          }
                          if (Date.parse(pr.created_at) > cutoff) continue;

                          await github.rest.issues.createComment({
                              ...repo,
                              issue_number: pr.number,
                              body: "This pull request has been automatically closed because the CLA has not been signed. Reopen it after signing.",
                          });
                          await github.rest.pulls.update({
                              ...repo,
                              pull_number: pr.number,
                              state: "closed",
                          });
                      }

            - name: Mark and close stale pull requests
              uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
              with:
                  days-before-pr-stale: 30
                  days-before-pr-close: 7
                  days-before-issue-stale: -1
                  days-before-issue-close: -1
                  stale-pr-message: >
                      This pull request has been automatically marked as stale
                      because it has had no activity for 30 days. It will be
                      closed in 7 days if there is no further activity.
                  close-pr-message: >
                      This pull request has been automatically closed because it
                      remained stale for 7 days with no activity. Reopen it if
                      you want to continue working on it.
