name: "Deploy (Web)"

on:
    schedule:
        # Weekdays at ~8:00 AM IST, offset from the hour to avoid congestion.
        - cron: "25 2 * * 1-5"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-web-apps.yml
        with:
            apps: photos albums accounts auth legacy cast payments locker share space memories paste embed ensu photobook
