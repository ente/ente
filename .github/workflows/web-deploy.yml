name: "Deploy (Web)"

on:
    schedule:
        # Weekdays at ~8:00 AM IST, offset from the hour to avoid congestion.
        - cron: "25 2 * * 1-5"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        defaults:
            run:
                working-directory: web

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level critical
            - name: Deploy photos
              uses: ./.github/actions/deploy-web-app
              with:
                  app: photos
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy albums
              uses: ./.github/actions/deploy-web-app
              with:
                  app: albums
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy accounts
              uses: ./.github/actions/deploy-web-app
              with:
                  app: accounts
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy auth
              uses: ./.github/actions/deploy-web-app
              with:
                  app: auth
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy legacy
              uses: ./.github/actions/deploy-web-app
              with:
                  app: legacy
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy cast
              uses: ./.github/actions/deploy-web-app
              with:
                  app: cast
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy payments
              uses: ./.github/actions/deploy-web-app
              with:
                  app: payments
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  output: dist

            - name: Deploy locker
              uses: ./.github/actions/deploy-web-app
              with:
                  app: locker
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy share
              uses: ./.github/actions/deploy-web-app
              with:
                  app: share
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy space
              uses: ./.github/actions/deploy-web-app
              with:
                  app: space
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy memories
              uses: ./.github/actions/deploy-web-app
              with:
                  app: memories
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy paste
              uses: ./.github/actions/deploy-web-app
              with:
                  app: paste
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy embed
              uses: ./.github/actions/deploy-web-app
              with:
                  app: embed
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

            - name: Deploy ensu
              uses: ./.github/actions/deploy-web-app
              with:
                  app: ensu
                  account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
