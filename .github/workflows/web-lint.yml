name: "Lint (Web)"

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: rust-wasm
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: rust-wasm

            - name: Restore Cast toolchain
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: cast-toolchain-${{ hashFiles('rust/bindings/wasm/cast/rust-toolchain.toml') }}
                  path: ~/.rustup/toolchains/nightly-*

            - name: Restore web cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: web-${{ github.sha }}
                  restore-keys: web-
                  path: |
                      web/apps/photos/.next/cache
                      web/apps/*/*.tsbuildinfo
                      web/packages/*/*.tsbuildinfo
                      web/packages/wasm/*/*.tsbuildinfo

            - run: npm ci

            - run: npm audit --audit-level critical

            - run: _ENTE_IS_DESKTOP=1 npm run build:photos

            - run: npm run build:wasm

            - run: node scripts/lint.mjs

            - run: npm test
