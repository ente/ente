appId: io.ente.bhari-frame
artifactName: ${productName}-${version}-${arch}.${ext}
files:
    - app/**/*
    - out
extraFiles:
    - from: build
      to: resources
beforeBuild: scripts/beforeBuild.js
protocols:
    - name: Ente
      schemes: ["ente"]
win:
    target: nsis
    azureSignOptions:
        publisherName: ENTE TECHNOLOGIES, INC.
        endpoint: https://eus.codesigning.azure.net/
        certificateProfileName: EnteTrustCertProfile
        codeSigningAccountName: EnteTechnologiesInc
    signExts: [".dll", ".node"]
nsis:
    deleteAppDataOnUninstall: true
linux:
    target: [AppImage, deb, rpm, pacman]
    category: Photography
    icon: ./build/icon.icns
mac:
    minimumSystemVersion: "13.3"
    target: default
    category: public.app-category.photography
    hardenedRuntime: true
    mergeASARs: false
    # The Rust N-API addon and the ONNX Runtime library are shipped as separate
    # per-arch Mach-Os (in both slices of the universal build) instead of fat
    # binaries; the app picks the one matching the process arch at runtime.
    x64ArchFiles: "**/{napi,onnxruntime}/**"
