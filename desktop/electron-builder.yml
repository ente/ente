appId: io.ente.bhari-frame
artifactName: ${productName}-${version}-${arch}.${ext}
files:
    - app/**/*
    - out
extraFiles:
    - from: build
      to: resources
      filter: ["**/*", "!ffmpeg/{ffprobe,ffprobe.exe,.archive-sha256}"]
beforeBuild: scripts/beforeBuild.js
beforePack: scripts/beforePack.js
protocols:
    - name: Ente
      schemes: ["ente"]
win:
    target:
        - target: nsis
          arch: [x64, arm64]
    azureSignOptions:
        publisherName: ENTE TECHNOLOGIES, INC.
        endpoint: https://eus.codesigning.azure.net/
        certificateProfileName: EnteTrustCertProfile
        codeSigningAccountName: EnteTechnologiesInc
    signExts: [".dll", ".node"]
nsis:
    deleteAppDataOnUninstall: true
linux:
    target:
        - target: AppImage
          arch: [x64, arm64]
        - target: deb
          arch: [x64, arm64]
        - target: rpm
          arch: [x64, arm64]
        - target: pacman
          arch: [x64, arm64]
    category: Photography
    icon: ./build/icon.icns
mac:
    minimumSystemVersion: "13.3"
    target:
        target: default
        arch: [universal]
    category: public.app-category.photography
    hardenedRuntime: true
    mergeASARs: false
    # Both macOS build passes contain separate x64 and arm64 binaries. Copy them
    # into the universal app unchanged; the app selects one at runtime.
    x64ArchFiles: "**/{napi,onnxruntime}/**"
