name: locker
description: "Ente Locker – Safe space for your important documents"
publish_to: "none"
version: 1.0.9+182

resolution: workspace
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  adaptive_theme: 3.7.2
  app_links: 6.4.1
  bip39: 1.0.6
  camera: 0.11.2+1
  camera_android_camerax: 0.6.30
  collection: 1.19.1
  convert: 3.1.2
  crypto: 3.0.7
  dio: 5.9.2
  dots_indicator: 4.0.1
  dotted_border: 3.1.0
  email_validator: 3.0.0
  ente_account_deletion:
    path: ../../packages/account_deletion
  ente_accounts:
    path: ../../packages/accounts
  ente_base:
    path: ../../packages/base
  ente_components:
    path: ../../packages/ente_components
  ente_configuration:
    path: ../../packages/configuration
  ente_contacts:
    path: ../../packages/contacts
  ente_crypto_api:
    path: ../../packages/ente_crypto_api
  ente_crypto_dart_adapter:
    path: ../../packages/ente_crypto_dart_adapter
  ente_events:
    path: ../../packages/events
  ente_feature_flag:
    path: ../../packages/feature_flag
  ente_icons:
    path: ../../packages/ente_icons
  ente_install_source:
    path: ../../packages/install_source
  ente_legacy:
    path: ../../packages/legacy
  ente_lock_screen:
    path: ../../packages/lock_screen
  ente_locker_frb:
    path: rust_builder
  ente_logging:
    path: ../../packages/logging
  ente_network:
    path: ../../packages/network
  ente_pure_utils:
    path: ../../packages/ente_pure_utils
  ente_sharing:
    path: ../../packages/sharing
  ente_strings:
    path: ../../packages/strings
  ente_ui:
    path: ../../packages/ui
  ente_utils:
    path: ../../packages/utils
  event_bus: 2.0.1
  expandable: 5.0.1
  fast_base58: 0.2.1
  file_picker: 11.0.3
  file_saver: 0.3.1
  flutter:
    sdk: flutter
  flutter_displaymode: 0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_svg: 2.3.0
  freezed_annotation: 3.1.0
  hugeicons: 1.1.7
  intl: 0.20.2
  listen_sharing_intent: 1.9.2
  logging: 1.3.0
  open_file: 3.5.11
  package_info_plus: 8.3.1
  path: 1.9.1
  path_provider: 2.1.5
  rive: 0.14.0-dev.13
  share_plus: 12.0.0
  shared_preferences: 2.5.3
  sqflite: 2.4.2
  tuple: 2.0.2
  url_launcher: 6.3.2
  uuid: 4.5.3

dev_dependencies:
  build_runner: 2.13.1
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.7
  flutter_test:
    sdk: flutter
  freezed: 3.2.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/svg/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Light.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
        - asset: assets/fonts/Inter-Bold.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher-icons/icon-ios-default.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1071FF"
  adaptive_icon_foreground: "assets/launcher-icons/icon-foreground.png"
  adaptive_icon_monochrome: "assets/launcher-icons/icon-monochrome-foreground.png"
  adaptive_icon_foreground_inset: 4
  image_path_ios_dark_transparent: "assets/launcher-icons/icon-ios-foreground.png"
  image_path_ios_tinted_grayscale: "assets/launcher-icons/icon-ios-tinted.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: "assets/launcher-icons/icon-foreground.png"
  android_gravity: center
  ios_content_mode: center
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/launcher-icons/icon-foreground.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    color_dark: "#000000"
    icon_background_color_dark: "#000000"
