name: ente_background_manager
description: Native scheduling and headless task lifecycle for Ente Photos.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.ente.background
        pluginClass: BackgroundManagerPlugin
      ios:
        pluginClass: BackgroundManagerPlugin
