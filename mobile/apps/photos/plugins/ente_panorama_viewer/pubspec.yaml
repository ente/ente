name: ente_panorama_viewer
description: First-party equirectangular panorama viewer for Ente Photos.

resolution: workspace
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.ente.panorama_viewer
        pluginClass: EntePanoramaViewerPlugin
      ios:
        pluginClass: EntePanoramaViewerPlugin
  shaders:
    - shaders/equirectangular.frag
