name: ente_mail
description: Ente-owned system mail composition for Android and iOS

resolution: workspace
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.ente.mail
        pluginClass: MailPlugin
      ios:
        pluginClass: MailPlugin
