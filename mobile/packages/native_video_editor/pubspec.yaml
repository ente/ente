name: native_video_editor
description: Ente-owned native video metadata, frame extraction, and editing operations

resolution: workspace
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.ente.native_video_editor
        pluginClass: NativeVideoEditorPlugin
      ios:
        pluginClass: NativeVideoEditorPlugin
