[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/cli-next",
    "apps/ensu/src-tauri",
    "bindings/frb/lib",
    "bindings/frb/locker",
    "bindings/frb/log",
    "bindings/frb/photos",
    "bindings/napi/photos",
    "bindings/uniffi/cast",
    "bindings/uniffi/ensu",
    "bindings/uniffi/log",
    "bindings/wasm/cast",
    "bindings/wasm/ensu",
    "bindings/wasm/legacy",
    "bindings/wasm/lib",
    "bindings/wasm/locker",
    "bindings/wasm/paste",
    "bindings/wasm/photos",
    "bindings/wasm/prelogin",
    "bindings/wasm/space",
    "crates/accounts",
    "crates/assets",
    "crates/cast",
    "crates/collections",
    "crates/contacts",
    "crates/core",
    "crates/ensu",
    "crates/ensu-crypto",
    "crates/exif",
    "crates/image",
    "crates/legacy",
    "crates/location",
    "crates/locker",
    "crates/ml",
    "crates/paste",
    "crates/photos",
    "crates/space",
    "crates/test-support",
    "tools/codegen",
    "tools/location-dataset",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.44", default-features = false }
clap = "4.6.1"
dialoguer = { version = "0.11.0", default-features = false }
dirs = "5.0.1"
ente-accounts = { path = "crates/accounts" }
ente-assets = { path = "crates/assets" }
ente-cast = { path = "crates/cast" }
ente-collections = { path = "crates/collections" }
ente-contacts = { path = "crates/contacts" }
ente-core = { path = "crates/core" }
ente-ensu = { path = "crates/ensu" }
ente-ensu-crypto = { path = "crates/ensu-crypto" }
ente-exif = { path = "crates/exif" }
ente-frb-lib = { path = "bindings/frb/lib" }
ente-frb-log = { path = "bindings/frb/log" }
ente-image = { path = "crates/image" }
ente-legacy = { path = "crates/legacy" }
ente-location = { path = "crates/location" }
ente-locker = { path = "crates/locker" }
ente-ml = { path = "crates/ml" }
ente-paste = { path = "crates/paste" }
ente-photos = { path = "crates/photos" }
ente-space = { path = "crates/space" }
ente-test-support = { path = "crates/test-support" }
ente-uniffi-log = { path = "bindings/uniffi/log" }
ente-wasm-lib = { path = "bindings/wasm/lib" }
fast_image_resize = { version = "5.5.0", features = ["image"] }
flate2 = "1.1.9"
flutter_rust_bridge = "=2.12.0"
flutter_rust_bridge_codegen = "=2.12.0"
futures-util = "0.3.32"
getrandom = { version = "0.4.0", features = ["wasm_js"] }
hkdf = "0.13.0"
hmac = "0.13.0"
image = "0.25.10"
js-sys = "0.3.102"
keyring = { version = "3.6.3", default-features = false }
log = "0.4.29"
md-5 = "0.11.0"
mockito = "1.7.2"
ort = { version = "=2.0.0-rc.13", default-features = false }
ort-sys = { version = "=2.0.0-rc.13", default-features = false }
quick-xml = "0.41.0"
regex = "1.11.1"
reqwest = { version = "0.12.28", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
sha1 = "0.11.0"
sha2 = "0.11.0"
srp = { version = "0.7.0-rc.3", default-features = false }
subtle = "2.0.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.41.0"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
uniffi = { version = "=0.31.0" }
uniffi_bindgen = { version = "=0.31.0", default-features = false, features = ["cargo-metadata"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = "1.23.1"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
zeroize = { version = "1.9.0", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(frb_expand)'] }
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
empty_drop = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
manual_let_else = "deny"
needless_collect = "deny"
path_buf_push_overwrite = "deny"
rc_mutex = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
suspicious_operation_groupings = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unused_async = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
unwrap_used = "deny"

# Unoptimized Argon2 makes production-strength derivations dominate test runtime.
[profile.dev.package.argon2]
opt-level = 3

# Unoptimized HNSW construction makes the vecdb recall fixtures dominate test runtime.
[profile.dev.package.ente-ml]
opt-level = 3
