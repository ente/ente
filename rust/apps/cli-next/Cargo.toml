[package]
name = "ente-cli-next"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
museum = []

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["std", "clock"] }
clap = { workspace = true, features = ["derive", "string"] }
clap_complete.workspace = true
dialoguer = { workspace = true, features = ["password"] }
dirs.workspace = true
ente-accounts.workspace = true
ente-auth.workspace = true
ente-collections.workspace = true
ente-core.workspace = true
ente-paste.workspace = true
ente-photos.workspace = true
ente-photos-export.workspace = true
env_logger.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
open.workspace = true
reqwest.workspace = true
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
ente-test-support.workspace = true
futures-util.workspace = true
mockito.workspace = true
same-file.workspace = true
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
