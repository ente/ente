[package]
name = "ente-cli-next"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
museum = []

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive"] }
dialoguer = { workspace = true, features = ["password"] }
dirs.workspace = true
ente-accounts.workspace = true
ente-core.workspace = true
ente-photos.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize.workspace = true

[dev-dependencies]
ente-test-support.workspace = true
mockito.workspace = true

[lints]
workspace = true
