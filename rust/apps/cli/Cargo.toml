[package]
name = "ente-rs"
version = "0.0.1"
edition = "2024"
description = "Command-line interface for Ente"
homepage = "https://ente.com"
repository = "https://github.com/ente/ente"
license = "AGPL-3.0-only"

[features]
museum = []

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = "0.11"
dirs = "5.0"
ente-accounts.workspace = true
ente-core.workspace = true
ente-paste.workspace = true
env_logger = "0.11"
futures = "0.3"
indicatif = "0.18"
log = "0.4"
open = "5.0"
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.41", features = ["full"] }
urlencoding.workspace = true
uuid = { version = "1.11", features = ["serde", "v4"] }
zeroize.workspace = true
zip = "2.2"

[dev-dependencies]
ente-test-support.workspace = true
mockito.workspace = true
sha2.workspace = true
srp = { version = "0.7.0-rc.3", default-features = false }
url.workspace = true
