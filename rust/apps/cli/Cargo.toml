[package]
name = "ente-rs"
version = "0.0.1"
edition.workspace = true
description = "Command-line interface for Ente"
homepage = "https://ente.com"
repository = "https://github.com/ente/ente"
license = "AGPL-3.0-only"

[features]
museum = []

[dependencies]
chrono = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive", "env"] }
dialoguer = { workspace = true, default-features = true }
dirs.workspace = true
ente-accounts.workspace = true
ente-core.workspace = true
ente-paste.workspace = true
env_logger = "0.11.0"
futures = "0.3.0"
indicatif = "0.18.0"
log.workspace = true
open = "5.0.0"
rusqlite = { workspace = true, default-features = true, features = ["serde_json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
urlencoding.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
ente-test-support.workspace = true
mockito.workspace = true
sha2.workspace = true
srp.workspace = true
url.workspace = true

[lints]
workspace = true
