[package]
name = "ensu-desktop"
version = "0.1.21-beta"
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
ente-assets.workspace = true
ente-core.workspace = true
ente-ensu.workspace = true
ente-ensu-crypto.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
log.workspace = true
notify = "6.1.1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.0"
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
