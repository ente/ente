[package]
name = "ente-wasm-lib"
edition.workspace = true

[features]
accounts = ["dep:ente-accounts", "dep:serde", "dep:serde-wasm-bindgen", "dep:tsify"]
cast = ["dep:ente-cast", "dep:serde", "dep:serde-wasm-bindgen", "dep:tsify"]
collections = ["session", "dep:ente-collections"]
contacts = [
    "session",
    "dep:ente-contacts",
    "dep:wasm-bindgen-futures",
]
crypto = ["dep:serde", "dep:serde-wasm-bindgen", "dep:tsify"]
crypto-blob = ["crypto"]
crypto-file = ["crypto-blob", "dep:md-5"]
crypto-seal = ["crypto"]
legacy = ["session", "dep:ente-legacy", "dep:wasm-bindgen-futures"]
locker = ["session", "dep:ente-locker"]
prelogin = ["accounts", "crypto"]
session = [
    "dep:ente-accounts",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:tsify",
]

[dependencies]
ente-accounts = { workspace = true, optional = true }
ente-cast = { workspace = true, optional = true }
ente-collections = { workspace = true, optional = true }
ente-contacts = { workspace = true, optional = true }
ente-core.workspace = true
ente-legacy = { workspace = true, optional = true }
ente-locker = { workspace = true, optional = true }
js-sys.workspace = true
log.workspace = true
md-5 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
thiserror.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console"] }

[lints]
workspace = true
