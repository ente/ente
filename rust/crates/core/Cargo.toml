[package]
name = "ente-core"
edition = "2024"

[dependencies]
# Keep argon2 on stable 0.5.x for now. This retains a second digest 0.10
# chain (via blake2 0.10) until argon2 0.6 reaches stable.
argon2 = "0.5"
base64 = "0.22"
blake2b_simd = "1.0"
crypto_secretstream = "=0.2.0"
# We enable `getrandom`'s `js` feature so that the crate works on
# `wasm32-unknown-unknown` (it uses the browser's `crypto.getRandomValues`).
# This also enables `rand_core::OsRng` on WASM.
getrandom = { version = "0.2", features = ["js"] }
log = "0.4"
md-5.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "charset", "system-proxy", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
salsa20 = "0.10"
serde.workspace = true
serde_json.workspace = true
subtle = "2"
thiserror.workspace = true
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
xsalsa20poly1305 = "0.9"
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
bytes = "1.11.1"
futures-core = "0.3.32"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mockito.workspace = true

[lints.rust]
missing_docs = "warn"
