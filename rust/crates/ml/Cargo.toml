[package]
name = "ente-ml"
edition.workspace = true

[features]
default = []
ml-assets = []
usearch = ["dep:usearch"]

[dependencies]
ente-assets.workspace = true
ente-image.workspace = true
fast_image_resize = { workspace = true, features = ["rayon"] }
half = "2.1.0"
html-escape = "0.2.13"
image.workspace = true
imageproc = "0.25.0"
log.workspace = true
nalgebra = "0.33.2"
once_cell = "1.20.2"
plsfix = "0.1.8"
rayon = "1.12.0"
regex.workspace = true
thiserror.workspace = true
# The FRB photos bridge calls the SimSIMD symbol exported by usearch 2.21.x.
# Newer usearch releases switched that implementation to numkong symbols.
usearch = { version = "=2.21.4", optional = true }

# Cargokit sets ORT_LIB_PATH to Ente's verified iOS archive.
[target.'cfg(target_os = "ios")'.dependencies]
ort = { workspace = true, features = [
    "std",
    "ndarray",
    "half",
    "coreml",
    "api-28",
] }

[target.'cfg(target_os = "android")'.dependencies]
wide = "0.7.33"
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
ort = { workspace = true, features = [
    "ndarray",
    "half",
    "api-28",
    "load-dynamic",
    "copy-dylibs",
    "webgpu",
    "xnnpack",
] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = [
    "ndarray",
    "half",
    "coreml",
    "api-28",
    "load-dynamic",
    "copy-dylibs",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { workspace = true, features = [
    "ndarray",
    "half",
    "api-28",
    "load-dynamic",
    "copy-dylibs",
    "webgpu",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "android", target_os = "macos", target_os = "linux", target_os = "windows")))'.dependencies]
ort = { workspace = true, features = [
    "ndarray",
    "half",
    "api-28",
    "load-dynamic",
    "copy-dylibs",
] }

[dev-dependencies]
wide = "0.7.33"
anyhow = "1.0.0"
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
url.workspace = true

[lints]
workspace = true
