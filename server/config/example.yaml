# Copy to museum.yaml beside config/compose.yaml.

# These must match the POSTGRES_* values in .env when using the bundled Postgres service.
db:
    host: postgres
    port: 5432
    name: ente_db
    user: pguser
    password: <password>

# Omit s3 when using only Ente Auth.
s3:
    # Set false for HTTPS endpoints.
    are_local_buckets: true
    # MinIO requires path-style URLs when are_local_buckets is false.
    use_path_style_urls: true
    b2-eu-cen:
      # Uncomment the below configuration to override the top-level configuration
      # are_local_buckets: true
      # use_path_style_urls: true
      key: <key>
      secret: <secret>
      endpoint: localhost:3200
      region: eu-central-2
      bucket: b2-eu-cen
    wasabi-eu-central-2-v3:
      # are_local_buckets: true
      # use_path_style_urls: true
      key: <key>
      secret: <secret>
      endpoint: localhost:3200
      region: eu-central-2
      bucket: wasabi-eu-central-2-v3
      compliance: false
    scw-eu-fr-v3:
      # are_local_buckets: true
      # use_path_style_urls: true
      key: <key>
      secret: <secret>
      endpoint: localhost:3200
      region: eu-central-2
      bucket: scw-eu-fr-v3

# Base endpoints for the web apps you run.
apps:
    public-albums: http://localhost:3002
    embed-albums: http://localhost:3006
    public-locker: http://localhost:3005
    public-paste: http://localhost:3008
    cast: http://localhost:3004
    accounts: http://localhost:3001
    space: http://localhost:3013
    public-memories: http://localhost:3010
    legacy: http://localhost:3011

space:
    assets:
        # Bucket ID used for Space post, avatar, and cover uploads.
        # If omitted, Space asset uploads return SPACE_ASSETS_UNAVAILABLE.
        primaryBucket: b2-eu-cen
    webPush:
        # Generate once with `go run tools/gen-vapid-keys/main.go` and keep the pair stable.
        publicKey:
        privateKey:
        # Bare email address. webpush-go adds the mailto: prefix.
        subscriber:

